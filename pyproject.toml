[project]
name = "ghostlows"
version = "0.0.1"
description = "Open benchmark for real-time CGM low-glucose alarms under sensor faults, with an insulin/carb context ablation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranav Karakala Reddy" }]
# Not capped at 3.11: the Pyodide runtime used by the upload app (phase 8) ships a newer
# Python, and micropip refuses wheels whose requires-python excludes it. Development and
# the simulator pin 3.11 via .python-version (gym, needed by simglucose, does not build on 3.13).
requires-python = ">=3.11"
# Core dependencies are only what ghostlows.io, ghostlows.metrics and ghostlows.retro need,
# so the wheel installs in Pyodide. Everything else is an extra.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.scripts]
ghostlows = "ghostlows.cli:main"

[project.optional-dependencies]
bench = [
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyarrow>=15",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "plotly>=5.20",
]
# simglucose and gym import pkg_resources at runtime, so setuptools must be installed;
# the <70 pin is from CLAUDE.md (Stack).
sim = [
    "simglucose==0.2.11",
    "setuptools<70",
]

[dependency-groups]
dev = [
    "ghostlows[bench,sim]",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostlows"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
# Ruff also formats Python blocks inside Markdown; the specs in docs/ keep their own layout.
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: needs internet access (deselected by default; run with -m network)",
]
