# Robustness arm: lows caught up to 45 min before onset instead of 30 (D12) (default mix only; the alarms H1-H2 need).
name: robust_early45
simulation: experiments/configs/sim_full.yaml
sweep: pisa
levels: [0.0, 0.5]
severity: 0.5
train_level: realistic
mixes: [default]
alarms: [floor_only, threshold, trend, baysal_gate, matched_filter_causal_gate, iforest_causal_gate, trend_combined_time, trend_combined_time_ctx, baysal_combined_time, baysal_combined_time_ctx, matched_filter_causal_combined_time, matched_filter_causal_combined_time_ctx, gbm_time, gbm_time_ctx]
n_folds: 5
n_boot: 2000
early_min: 45.0
