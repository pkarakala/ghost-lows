# Robustness arm (A14): test PISAs drawn from Facchinetti 2016's fitted (P, D, tau) distributions,
# with tau per event and the published correlations, while detectors keep the nominal shape (D8)
# (default mix only; the alarms H1-H2 need). Durations are not redrawn, so tau varies alone (P12).
name: robust_tau_per_event
simulation: experiments/configs/sim_full.yaml
sweep: pisa
levels: [0.5, 1.0]
severity: 0.5
train_level: realistic
mixes: [default]
alarms: [floor_only, threshold, trend, baysal_gate, matched_filter_causal_gate, iforest_causal_gate, trend_combined_time, trend_combined_time_ctx, baysal_combined_time, baysal_combined_time_ctx, matched_filter_causal_combined_time, matched_filter_causal_combined_time_ctx, gbm_time, gbm_time_ctx]
n_folds: 5
n_boot: 2000
pisa_draw: parameters
