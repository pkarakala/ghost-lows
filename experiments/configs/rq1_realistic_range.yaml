# RQ1 at the two ends of the realistic PISA range (A14): Facchinetti 2016's night rate (about 13%
# of nights) and the Lobo-calibrated level (D19). Same fit as the main analysis; reported as a
# range, never as one realistic value (default mix only; the alarms H1-H2 need).
name: rq1_realistic_range
simulation: experiments/configs/sim_full.yaml
sweep: pisa
levels: [facchinetti, realistic]
severity: 0.5
train_level: realistic
mixes: [default]
alarms: [floor_only, threshold, trend, baysal_gate, matched_filter_causal_gate, iforest_causal_gate, trend_combined_time, trend_combined_time_ctx, baysal_combined_time, baysal_combined_time_ctx, matched_filter_causal_combined_time, matched_filter_causal_combined_time_ctx, gbm_time, gbm_time_ctx]
n_folds: 5
n_boot: 2000
