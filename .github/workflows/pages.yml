name: Upload app (GitHub Pages)

# Builds the ghostlows wheel into app/, checks the page in a real browser (upload renders, no
# request carries the file) and only then deploys app/ to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/ghostlows/**"
      - "scripts/build_app.py"
      - "tests/test_app_browser.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --group browser
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/build_app.py
      - name: Browser test of the page
        run: uv run pytest -q -m browser tests/test_app_browser.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
